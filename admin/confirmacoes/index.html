<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Confirmações | MORADA 2026</title>
<style>
:root{font-family:system-ui,sans-serif;color:#203a35;background:#f7f3e9}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:clamp(26px,4vw,42px);margin-bottom:6px}p{line-height:1.5}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,button,a.export{font:inherit;padding:12px 16px;border:1px solid #b8c3b8;border-radius:7px}input{flex:1;min-width:220px}button,a.export{background:#173f3b;color:white;cursor:pointer;text-decoration:none}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #d9d9cb;overflow-wrap:anywhere}th{background:#eae8dc}div.scroll{overflow-x:auto;border-radius:9px}small{color:#53645b}#status{min-height:24px}a.back{color:#173f3b}
</style></head><body><main><a class="back" href="/">← Voltar ao site</a><h1>Confirmações de leitura</h1><p>MORADA 2026 · Área administrativa</p><p><small>Dados pessoais de responsáveis e alunos. Acesso restrito à organização.</small></p>
<div class="controls"><input id="search" placeholder="Buscar responsável ou aluno" aria-label="Buscar por nome"><button id="go">Buscar</button><a class="export" id="export" href="/admin/api/confirmacoes?format=csv">Exportar CSV</a></div>
<p id="status" role="status">Carregando registros…</p><div class="scroll"><table><thead><tr><th>Responsável</th><th>Aluno</th><th>Data e hora (Brasília)</th><th>Protocolo</th><th>Versão</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
const search=document.querySelector('#search'),rows=document.querySelector('#rows'),status=document.querySelector('#status');
async function load(){
  const q=search.value.trim();status.textContent='Consultando…';rows.replaceChildren();
  document.querySelector('#export').href='/admin/api/confirmacoes?format=csv&q='+encodeURIComponent(q);
  try{
    const r=await fetch('/admin/api/confirmacoes?q='+encodeURIComponent(q),{credentials:'same-origin',cache:'no-store'});
    if(!r.ok)throw Error('Acesso não autorizado ou serviço indisponível (HTTP '+r.status+').');
    const data=await r.json();if(!Array.isArray(data.results))throw Error('Resposta inválida.');
    for(const record of data.results){
      const tr=document.createElement('tr');
      const date=new Date(record.confirmado_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
      for(const value of [record.responsavel,record.aluno,date,record.protocolo,record.versao_orientacoes]){
        const td=document.createElement('td');td.textContent=value||'';tr.appendChild(td);
      }
      rows.appendChild(tr);
    }
    status.textContent=data.results.length+' registro(s) exibido(s)'+(data.results.length===data.limit?' (limite de exibição atingido)':'')+'.';
  }catch(e){status.textContent=e.message;}
}
document.querySelector('#go').addEventListener('click',load);
search.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
load();
</script></body></html>
